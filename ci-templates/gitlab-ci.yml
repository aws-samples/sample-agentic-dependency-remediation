# GitLab CI template (gitlab.com or self-managed GitLab).
#
# Runs the remediation agent on a schedule (or manually), applies the verified patch
# on a new branch, and opens a merge request whose description is the agent's report.
#
# Setup, once per project:
#   1. AWS access: an IAM role with the stack's ClientPolicy, trusted for this project
#      through GitLab OIDC (recommended). Set CI/CD variable REMEDIATION_ROLE_ARN.
#   2. CI/CD variable REMEDIATION_GIT_TOKEN (masked, protected): a project access token
#      with the api and write_repository scopes, used to push the branch and open the MR.
#   3. CI/CD variable REMEDIATION_CLIENT: pip install source for the client, for example
#      git+https://<host>/<group>/agentic-dependency-remediation.git#subdirectory=client
#   4. CI/CD variable REMEDIATION_REGION: the AWS Region where the stack is deployed, for example eu-west-1.
#   5. A pipeline schedule (Build > Pipeline schedules), for example weekly.
#
# If your GitLab instance does not accept Git over HTTPS with a token, push the branch over
# SSH with a deploy key instead, or create the branch and commit with the Commits API
# (POST /projects/:id/repository/commits). The merge request call below uses the REST API.
#
# Include from your .gitlab-ci.yml:
#   include:
#     - local: ci/dependency-remediation.gitlab-ci.yml

dependency-remediation:
  image: public.ecr.aws/docker/library/python:3.12-slim
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
    - if: '$CI_PIPELINE_SOURCE == "web"'
      when: manual
  id_tokens:
    AWS_OIDC_TOKEN:
      aud: sts.amazonaws.com
  variables:
    AWS_REGION: $REMEDIATION_REGION
    AWS_ROLE_ARN: $REMEDIATION_ROLE_ARN
    AWS_WEB_IDENTITY_TOKEN_FILE: /tmp/aws-oidc-token
    AWS_ROLE_SESSION_NAME: gitlab-$CI_PROJECT_ID-$CI_PIPELINE_ID
  before_script:
    - '[ -n "$AWS_REGION" ] || { echo "Set the REMEDIATION_REGION CI/CD variable to the stack Region."; exit 1; }'
    - apt-get update -qq && apt-get install -y -qq git curl > /dev/null
    - echo "$AWS_OIDC_TOKEN" > "$AWS_WEB_IDENTITY_TOKEN_FILE"
    - pip install -q "$REMEDIATION_CLIENT"
  script:
    - remediate --project "$CI_PROJECT_NAME" --out remediation-output || status=$?
    - |
      if [ ! -f remediation-output/fix.patch ]; then
        echo "No patch produced."; cat remediation-output/report.md 2>/dev/null || true
        exit "${status:-0}"
      fi
    - BRANCH="remediation/deps-$CI_PIPELINE_ID"
    - git checkout -b "$BRANCH"
    - git apply --index remediation-output/fix.patch
    - git -c user.name="Dependency Remediation Bot" -c user.email="noreply@$CI_SERVER_HOST" commit -m "fix(deps): remediate vulnerable dependencies"
    - git push "https://oauth2:${REMEDIATION_GIT_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git" "HEAD:$BRANCH"
    - |
      curl --fail --silent --show-error --request POST \
        --header "PRIVATE-TOKEN: $REMEDIATION_GIT_TOKEN" \
        --data-urlencode "source_branch=$BRANCH" \
        --data-urlencode "target_branch=$CI_DEFAULT_BRANCH" \
        --data-urlencode "title=fix(deps): remediate vulnerable dependencies" \
        --data-urlencode "description@remediation-output/report.md" \
        --data-urlencode "labels=security,dependencies,ai-generated" \
        --data-urlencode "remove_source_branch=true" \
        "$CI_API_V4_URL/projects/$CI_PROJECT_ID/merge_requests" > /dev/null
  artifacts:
    when: always
    paths:
      - remediation-output/
    expire_in: 30 days

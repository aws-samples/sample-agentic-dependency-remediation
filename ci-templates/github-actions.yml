# GitHub Actions template. Copy to .github/workflows/dependency-remediation.yml.
#
# Setup, once per repository:
#   1. An IAM role with the stack's ClientPolicy, trusted for this repository through
#      GitHub OIDC. Set repository variable REMEDIATION_ROLE_ARN.
#   2. Repository variable REMEDIATION_CLIENT: pip install source for the client, for example
#      git+https://github.com/<org>/agentic-dependency-remediation.git#subdirectory=client
#   3. Repository variable REMEDIATION_REGION: the AWS Region where the stack is deployed, for example eu-west-1.
#   4. Settings > Actions > General: allow GitHub Actions to create pull requests.

name: dependency-remediation
on:
  schedule:
    - cron: "0 6 * * 1"   # Mondays 06:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  remediate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a  # v4.3.1
        with:
          role-to-assume: ${{ vars.REMEDIATION_ROLE_ARN }}
          aws-region: ${{ vars.REMEDIATION_REGION }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"
      - run: pip install -q "${{ vars.REMEDIATION_CLIENT }}"
      - name: Run the agent
        run: remediate --project "${{ github.event.repository.name }}" --out remediation-output || echo "status=$?" >> "$GITHUB_ENV"
      - name: Open a pull request with the verified patch
        if: hashFiles('remediation-output/fix.patch') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BRANCH="remediation/deps-${{ github.run_id }}"
          git checkout -b "$BRANCH"
          git apply --index remediation-output/fix.patch
          git -c user.name="Dependency Remediation Bot" -c user.email="noreply@github.com" commit -m "fix(deps): remediate vulnerable dependencies"
          git push origin "HEAD:$BRANCH"
          gh pr create --title "fix(deps): remediate vulnerable dependencies" --body-file remediation-output/report.md --base "${{ github.event.repository.default_branch }}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        if: always()
        with:
          name: remediation-output
          path: remediation-output/
